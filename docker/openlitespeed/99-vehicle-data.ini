; vehicle-data-api - applies to the LiteSpeed SAPI and to the lsphp CLI (same scan dir)
date.timezone = UTC
memory_limit = 512M
max_execution_time = 120
expose_php = Off
file_uploads = Off
post_max_size = 64K
opcache.enable = 1
opcache.enable_cli = 0
; development: the tree is a bind mount; production sets 0 (runbook §3)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
