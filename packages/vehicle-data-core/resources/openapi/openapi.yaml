    MakeList: { description: OK, headers: { X-Data-Attribution: { $ref: "#/components/headers/X-Data-Attribution" }, Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, meta, links], properties: { data: { type: array, items: { $ref: "#/components/schemas/Make" } }, meta: { $ref: "#/components/schemas/ListMeta" }, links: { $ref: "#/components/schemas/Links" } } } }, text/csv: { schema: { type: string, description: "UTF-8 with BOM, ';' delimiter; header row (in this order, narrowed by fields): id;slug;name;kind;manufacturer;ro_fleet.count;ro_fleet.year" } } } }
    ModelList: { description: OK, headers: { X-Data-Attribution: { $ref: "#/components/headers/X-Data-Attribution" }, Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, meta, links], properties: { data: { type: array, items: { $ref: "#/components/schemas/Model" } }, meta: { $ref: "#/components/schemas/ListMeta" }, links: { $ref: "#/components/schemas/Links" } } } }, text/csv: { schema: { type: string, description: "UTF-8 with BOM, ';' delimiter; header row (in this order, narrowed by fields): id;slug;name;make;first_year;last_year;ro_fleet.count;ro_fleet.year" } } } }
    VariantList: { description: OK, headers: { X-Data-Attribution: { $ref: "#/components/headers/X-Data-Attribution" }, Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, meta, links], properties: { data: { type: array, items: { $ref: "#/components/schemas/Variant" } }, meta: { $ref: "#/components/schemas/ListMeta" }, links: { $ref: "#/components/schemas/Links" } } } }, text/csv: { schema: { type: string, description: "UTF-8 with BOM, ';' delimiter; header row (in this order, narrowed by fields): id;make;model;fuel.code;fuel.label;eu_category.code;eu_category.label;euro_norm.code;euro_norm.label;engine_cc;power_kw;power_hp;mass_kg;co2_wltp;year_from;year_to;specifications" } } } }
