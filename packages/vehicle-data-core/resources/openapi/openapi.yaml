    TooManyRequests: { description: "Rate limit, daily quota or failed-authentication limit exceeded. X-RateLimit-Limit and X-RateLimit-Remaining are sent only for the per-minute rate-limit cause (docs/api.md); the daily-quota cause sends Retry-After only, and the failed-authentication cause sends Retry-After only (there is no resolved client to have a limit). Not declared here because OpenAPI 3.0.3 headers are response-level, not per-cause.", headers: { Retry-After: { schema: { type: integer } }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  schemas:
