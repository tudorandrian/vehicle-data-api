      required: [id, slug, name, country_code, founded_year, parent, website]
      properties:
        id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: "Immutable public identifier (ADR 0007)" }
        slug: { type: string }
        name: { type: string }
        country_code: { type: string, nullable: true }
        founded_year: { type: integer, nullable: true }
        parent: { type: string, nullable: true, description: parent manufacturer slug }
        website: { type: string, nullable: true }
        logo: { $ref: "#/components/schemas/Logo" }
    Make:
      type: object
      required: [id, slug, name, kind, manufacturer]
      properties:
        id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: "Immutable public identifier (ADR 0007)" }
        slug: { type: string }
        name: { type: string }
        kind: { type: string }
        manufacturer: { type: string, nullable: true }
        ro_fleet: { $ref: "#/components/schemas/RoFleet" }
    Model:
      type: object
      required: [id, slug, name, make, first_year, last_year]
      properties:
        id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: "Immutable public identifier (ADR 0007)" }
        slug: { type: string }
        name: { type: string }
        make: { type: string }
        first_year: { type: integer, nullable: true }
        last_year: { type: integer, nullable: true }
        ro_fleet: { $ref: "#/components/schemas/RoFleet" }
    Variant:
      type: object
      required: [id, make, model, fuel, eu_category, euro_norm, engine_cc, power_kw, power_hp, mass_kg, co2_wltp, year_from, year_to]
      properties:
        id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$", description: "Immutable public identifier (ADR 0007)" }
        make: { type: string }
        model: { type: string }
        fuel: { $ref: "#/components/schemas/TermRef" }
        eu_category: { $ref: "#/components/schemas/TermRef" }
        euro_norm: { type: object, nullable: true, required: [code, label], properties: { code: { type: string }, label: { type: string } } }
        engine_cc: { type: integer, nullable: true }
        power_kw: { type: integer, nullable: true }
        power_hp: { type: integer, nullable: true, description: "derived, round(kW × 1.35962)" }
        mass_kg: { type: integer, nullable: true }
        co2_wltp: { type: integer, nullable: true }
        year_from: { type: integer, nullable: true }
        year_to: { type: integer, nullable: true }
        specifications: { $ref: "#/components/schemas/Specifications" }
    Specifications:
      anyOf: [ { $ref: "#/components/schemas/CarSpecifications" } ]
      description: Kind-specific specifications; the kind is implied by the make.
    CarSpecifications:
      type: object
      title: CarSpecifications
      description: Optional car-specific attributes (class 3). Keys appear only when a held source provides them.
      additionalProperties: false
      properties:
        doors: { type: integer, minimum: 2, maximum: 6 }
        seats: { type: integer, minimum: 1, maximum: 9 }
        body_type: { type: string, description: taxonomy body_type code }
        gearbox: { type: string, description: taxonomy gearbox code }
        drive: { type: string, description: taxonomy drive code }
        euro_stage_raw: { type: string, maxLength: 40, description: "type-approval emission stage code as published (e.g. 6AP, EURO 6 EA)" }
        fuel_mode: { type: string, enum: [M, B, F, H, P, E], description: "EEA fuel mode (M mono, B bi-fuel, F flex, H hybrid, P plug-in hybrid, E electric)" }
        co2_nedc: { type: integer }
        electric_range_km: { type: integer }
        energy_wh_km: { type: integer }
        type_approval_number: { type: string, maxLength: 40 }
        type_code: { type: string, maxLength: 40 }
        variant_code: { type: string, maxLength: 40 }
        version_code: { type: string, maxLength: 40 }
        fuel_consumption_l_100km: { type: number }
    HealthLive:
      type: object
      required: [data]
      properties: { data: { type: object, required: [status, version, time], properties: { status: { type: string }, version: { type: string }, time: { type: string, format: date-time } } } }
    HealthReady:
      type: object
      required: [data]
      properties: { data: { type: object, required: [status, checks, time], properties: { status: { type: string, enum: [ok, degraded] }, checks: { type: object }, time: { type: string, format: date-time } } } }
    VinDecode:
      type: object
      required: [vin, wmi, vds, vis, region, manufacturer, check_digit, model_year, plant_code, serial, confidence, note]
      properties:
        vin: { type: string }
        wmi: { type: string }
        vds: { type: string }
        vis: { type: string }
        region: { type: string, enum: [africa, asia, europe, north_america, oceania, south_america, unknown] }
        manufacturer: { type: object, nullable: true, required: [name, country_code], properties: { name: { type: string }, country_code: { type: string, nullable: true } } }
        check_digit: { type: object, required: [applies, expected, actual, valid], properties: { applies: { type: boolean }, expected: { type: string }, actual: { type: string }, valid: { type: boolean } } }
        model_year: { type: object, required: [character, candidates, resolved], properties: { character: { type: string }, candidates: { type: array, items: { type: integer } }, resolved: { type: integer, nullable: true } } }
        plant_code: { type: string }
        serial: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        note: { type: string }
