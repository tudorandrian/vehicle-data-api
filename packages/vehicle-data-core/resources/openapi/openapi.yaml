      type: object
      required: [id, code, label, sort_order, parent_code]
      description: "A controlled-vocabulary term. id is a 26-character Crockford base32 public id, stable; code is the current readable key and can be renamed while its id remains stable."
      properties: { id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }, code: { type: string, pattern: "^[a-z0-9_]+$" }, label: { type: string }, sort_order: { type: integer }, parent_code: { type: string, nullable: true, pattern: "^[a-z0-9_]+$" } }
    TermRef:
      type: object
      required: [code, label]
      properties: { code: { type: string }, label: { type: string } }
    TaxonomySummary:
      type: object
      required: [id, name, label, description, term_count]
      description: "A controlled vocabulary. id is a 26-character Crockford base32 public id, stable; name is the current readable route key and can be renamed."
      properties: { id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }, name: { type: string, pattern: "^[a-z_]+$" }, label: { type: string }, description: { type: string }, term_count: { type: integer } }
    Taxonomy:
      type: object
      required: [id, name, label, description, terms]
      description: "A controlled vocabulary. id is stable; name is the current readable key. Retired names redirect to the current name."
      properties: { id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }, name: { type: string, pattern: "^[a-z_]+$" }, label: { type: string }, description: { type: string }, terms: { type: array, items: { $ref: "#/components/schemas/Term" } } }
    RoFleet:
      type: object
      description: "Class 3: Romanian registered fleet (DRPCIV), count and reference year always together"
      required: [count, year]
      properties: { count: { type: integer }, year: { type: integer } }
    Logo:
      type: object
      description: "Class 3: Wikimedia Commons file reference (never the image). Present only with an admitted licence (public domain, CC0, or CC BY without share-alike); the Commons file page at `url` carries the author credit and full licence terms."
      required: [commons_file, licence, url]
      properties: { commons_file: { type: string }, licence: { type: string, description: Commons LicenseShortName }, url: { type: string, description: Commons file description page } }
    Manufacturer:
