openapi: 3.0.3
info:
  title: vehicle-data-api
  version: 1.0.0
  description: |
    Read-only vehicle catalogue API on openly licensed public data (EEA CO2 monitoring, DRPCIV fleet statistics, Wikidata, NHTSA vPIC).
    All `/v1/*` data routes require a bearer API key. Labels are Romanian by default (`lang=ro`) and English on request (`lang=en`).
    Field classes: class 1 keys are never null; class 2 keys are always present and may be `null` (= not in any held source); class 3 keys are omitted when absent.
    Enrichers must preserve class 1 and class 2 keys, including keys whose value is null; violations produce an internal error.
    Consumers must ignore unknown keys; additive changes stay in `v1`, breaking changes ship as `/v2` with `Deprecation` and `Sunset` headers on `v1`.
    Every route answers GET and HEAD only (plus the anonymous CORS preflight `OPTIONS /v1/*`); any other method answers `405` as an `application/problem+json` body.
  license: { name: MIT, url: https://opensource.org/licenses/MIT }
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: system, description: Health and contract }
  - { name: taxonomies, description: Controlled vocabularies with ro/en labels }
  - { name: catalogue, description: "Manufacturers, makes, models, variants" }
  - { name: vin, description: Structural VIN decoding }
  - { name: snapshots, description: Whole-resource sync as a downloadable gzip JSON Lines artifact }
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: healthLive
      security: []
      summary: Liveness (anonymous)
      responses:
        "200": { description: OK, headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }, content: { application/json: { schema: { $ref: "#/components/schemas/HealthLive" } } } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/health/ready:
    get:
      tags: [system]
      operationId: healthReady
      summary: Readiness (keyed) — database, cache, queue backlog, last import per source
      description: A failed database or cache probe returns 503 with status degraded. Authentication and rate limiting run before the probes and can fail independently.
      responses:
        "200": { description: OK, headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { $ref: "#/components/schemas/HealthReady" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { description: Degraded, headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }, content: { application/json: { schema: { $ref: "#/components/schemas/HealthReady" } } } }
  /openapi.yaml:
    get:
      tags: [system]
      operationId: openapiDocument
      security: []
      summary: This document, assembled with every registered kind (anonymous)
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }, content: { application/yaml: { schema: { type: string } } } }
        "304": { description: Not Modified }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/taxonomies:
    get:
      tags: [taxonomies]
      operationId: listTaxonomies
      parameters: [ { $ref: "#/components/parameters/lang" } ]
      responses:
        "200":
          description: OK
          headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }
          content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: "#/components/schemas/TaxonomySummary" } }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/taxonomies/{key}:
    get:
      tags: [taxonomies]
      operationId: showTaxonomy
      parameters:
        - { name: key, in: path, required: true, description: "Stable taxonomy id or its current name. A retired name returns 301 to the current name.", schema: { type: string, pattern: "^(?:[0-9A-HJKMNP-TV-Z]{26}|[a-z_]+)$" } }
        - { $ref: "#/components/parameters/lang" }
      responses:
        "200":
          description: OK
          headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }
          content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { $ref: "#/components/schemas/Taxonomy" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/manufacturers:
    get:
      tags: [catalogue]
      operationId: listManufacturers
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/per_page" }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, founded_year, -founded_year, country_code, -country_code, updated_at, -updated_at] } }
        - { $ref: "#/components/parameters/fields" }
        - { $ref: "#/components/parameters/updated_since" }
        - { $ref: "#/components/parameters/lang" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/format" }
        - { name: country_code, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
      responses:
        "200": { $ref: "#/components/responses/ManufacturerList" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/manufacturers/{key}:
    get:
      tags: [catalogue]
      operationId: showManufacturer
      parameters: [ { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/lang" } ]
      responses:
        "200": { description: OK, headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, sources, meta], properties: { data: { $ref: "#/components/schemas/Manufacturer" }, sources: { $ref: "#/components/schemas/Sources" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } } }
        "301": { $ref: "#/components/responses/MovedPermanently" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/makes:
    get:
      tags: [catalogue]
      operationId: listMakes
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/per_page" }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, ro_fleet_count, -ro_fleet_count, updated_at, -updated_at] } }
        - { $ref: "#/components/parameters/fields" }
        - { $ref: "#/components/parameters/updated_since" }
        - { $ref: "#/components/parameters/lang" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/format" }
        - { name: kind, in: query, schema: { type: string, default: car }, description: registered vehicle kind (422 for an unknown kind) }
        - { name: manufacturer, in: query, schema: { type: string }, description: manufacturer slug }
      responses:
        "200": { $ref: "#/components/responses/MakeList" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/makes/{key}:
    get:
      tags: [catalogue]
      operationId: showMake
      parameters: [ { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/lang" } ]
      responses:
        "200": { description: OK, headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, sources, meta], properties: { data: { $ref: "#/components/schemas/Make" }, sources: { $ref: "#/components/schemas/Sources" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } } }
        "301": { $ref: "#/components/responses/MovedPermanently" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/makes/{key}/models:
    get:
      tags: [catalogue]
      operationId: listMakeModels
      parameters:
        - { $ref: "#/components/parameters/key" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/per_page" }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, first_year, -first_year, ro_fleet_count, -ro_fleet_count, updated_at, -updated_at] } }
        - { $ref: "#/components/parameters/fields" }
        - { $ref: "#/components/parameters/updated_since" }
        - { $ref: "#/components/parameters/lang" }
        - { $ref: "#/components/parameters/q" }
        - { $ref: "#/components/parameters/format" }
      responses:
        "200": { $ref: "#/components/responses/ModelList" }
        "301": { $ref: "#/components/responses/MovedPermanently" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/models/{key}:
    get:
      tags: [catalogue]
      operationId: showModel
      parameters: [ { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/lang" } ]
      responses:
        "200": { description: OK, headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, sources, meta], properties: { data: { $ref: "#/components/schemas/Model" }, sources: { $ref: "#/components/schemas/Sources" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } } }
        "301": { $ref: "#/components/responses/MovedPermanently" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/models/{key}/variants:
    get:
      tags: [catalogue]
      operationId: listModelVariants
      parameters:
        - { $ref: "#/components/parameters/key" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/per_page" }
        - { name: sort, in: query, schema: { type: string, enum: [power_kw, -power_kw, engine_cc, -engine_cc, co2_wltp, -co2_wltp, year_from, -year_from, updated_at, -updated_at] } }
        - { $ref: "#/components/parameters/fields" }
        - { $ref: "#/components/parameters/updated_since" }
        - { $ref: "#/components/parameters/lang" }
        - { $ref: "#/components/parameters/format" }
        - { name: fuel, in: query, schema: { type: string }, description: taxonomy fuel code }
        - { name: eu_category, in: query, schema: { type: string }, description: taxonomy eu_category code }
        - { name: euro_norm, in: query, schema: { type: string }, description: taxonomy euro_norm code }
        - { name: year, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 }, description: year_from ≤ year ≤ year_to (open-ended when year_to is null) }
        - { name: power_kw_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: power_kw_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: engine_cc_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: engine_cc_max, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { $ref: "#/components/responses/VariantList" }
        "301": { $ref: "#/components/responses/MovedPermanently" }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/variants/{id}:
    get:
      tags: [catalogue]
      operationId: showVariant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" } }
        - { $ref: "#/components/parameters/lang" }
      responses:
        "200": { description: OK, headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, sources, meta], properties: { data: { $ref: "#/components/schemas/Variant" }, sources: { $ref: "#/components/schemas/Sources" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } } }
        "304": { description: Not Modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/snapshots/{resource}:
    get:
      tags: [snapshots]
      operationId: snapshotResource
      summary: Whole-resource sync as gzipped JSON Lines (scope snapshot:read)
      description: The body is always the gzip file whatever the Accept header; there is no 406 and no ETag on this route.
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [manufacturers, makes, models, variants] } }
        - { $ref: "#/components/parameters/updated_since" }
        - { $ref: "#/components/parameters/lang" }
      responses:
        "200": { description: "gzip file artifact, one JSON object per line once decompressed", headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, Content-Disposition: { $ref: "#/components/headers/Content-Disposition" }, Vary: { $ref: "#/components/headers/Vary" }, X-Data-Licences: { $ref: "#/components/headers/X-Data-Licences" }, X-Data-Attribution: { $ref: "#/components/headers/X-Data-Attribution" }, Link: { $ref: "#/components/headers/Link" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/gzip: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/vin/{vin}:
    get:
      tags: [vin]
      operationId: decodeVin
      summary: Structural VIN decode (scope vin:decode) — not a registration lookup
      parameters:
        - { name: vin, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { $ref: "#/components/parameters/lang" }
      responses:
        "200": { description: OK, headers: { Cache-Control: { $ref: "#/components/headers/Cache-Control" }, Content-Language: { $ref: "#/components/headers/Content-Language" }, ETag: { $ref: "#/components/headers/ETag" }, Vary: { $ref: "#/components/headers/Vary" }, X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }, X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }, X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" } }, content: { application/json: { schema: { type: object, required: [data, sources, meta], properties: { data: { $ref: "#/components/schemas/VinDecode" }, sources: { $ref: "#/components/schemas/Sources" }, meta: { $ref: "#/components/schemas/ItemMeta" } } } } } }
        "304": { description: Not Modified }
        "400": { description: Malformed VIN, headers: { X-Request-Id: { $ref: "#/components/headers/X-Request-Id" } }, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: "Authorization: Bearer vd_live_…" }
  headers:
    Content-Language: { schema: { type: string, enum: [ro, en] } }
    ETag: { schema: { type: string, pattern: '^W/"[0-9a-f]{64}"$' }, description: "Weak entity tag (semantic equality: the same tag means the same data, whatever meta.generated_at says); present only on JSON representations and /openapi.yaml (never on CSV or snapshots); send it back as If-None-Match for 304. Weak comparison: the strong form of the same tag, a list, or * all match." }
    Vary: { schema: { type: string }, description: "Accept-Language on JSON routes, plus Authorization and Origin on keyed routes" }
    Cache-Control: { schema: { type: string }, description: "private, max-age=0, must-revalidate on keyed JSON and CSV responses (never storable by shared caches); private, max-age=0 on snapshots" }
    X-Data-Attribution: { schema: { type: string }, description: "ASCII attribution statements of every source present in the response, separated by '; ' (omitted on an empty page)" }
    Content-Disposition: { schema: { type: string }, description: "Attachment file name. Sent on snapshots always, and on a list route's CSV representation (?format=csv or Accept: text/csv) — not on that same route's JSON representation. OpenAPI 3.0.3 headers are declared per response object, not per media type, so this is documented here rather than on the list responses' shared 200, which also cover JSON." }
    WWW-Authenticate: { schema: { type: string }, description: Bearer challenge }
    X-Data-Licences: { schema: { type: string }, description: "Comma-separated licence ids of every source that contributed a record of this resource (see docs/data-sources.md)" }
    Link: { schema: { type: string }, description: 'Link to docs/data-sources.md, rel="license"' }
    X-Request-Id: { schema: { type: string, format: uuid }, description: "Present on every response under /v1, /openapi.yaml and /docs; echoes a caller-supplied UUID or a freshly generated one; also appears as request_id in problem bodies" }
