        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string, description: "Same value as the X-Request-Id response header" }
    ForbiddenProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            required_scope: { type: string, description: "Present for /problems/insufficient-scope" }
            origin: { type: string, description: "Present for /problems/origin-not-allowed" }
    ValidationProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [errors]
          properties:
            errors: { type: array, items: { type: object, required: [field, code, message], properties: { field: { type: string }, code: { type: string }, message: { type: string } } } }
    ListMeta:
      type: object
      required: [page, per_page, total, generated_at, lang]
      properties: { page: { type: integer }, per_page: { type: integer }, total: { type: integer }, generated_at: { type: string, format: date-time }, lang: { type: string } }
    ItemMeta:
      type: object
      required: [generated_at, lang]
      properties: { generated_at: { type: string, format: date-time }, lang: { type: string } }
    Links:
      type: object
      required: [self, next, prev]
      properties: { self: { type: string, nullable: true }, next: { type: string, nullable: true }, prev: { type: string, nullable: true } }
    Sources:
      type: array
      items:
        type: object
        required: [key, licence, attribution, retrieved_at]
        properties: { key: { type: string }, licence: { type: string }, attribution: { type: string }, retrieved_at: { type: string, format: date-time } }
